<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1009">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Loup-garou</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%BA</text></svg>">
</head>
<body>

<!-- Bord de feuille dechire : applique au calque de papier, jamais au texte. -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <filter id="rough" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.019" numOctaves="5" seed="11" result="n"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
</svg>

<div class="backdrop"><div class="sheet"></div></div>
<div id="app"></div>
<div id="toast"></div>

<script src="./qrcode.js"></script>
<script src="./engine.js"></script>
<script src="./peerjs.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
